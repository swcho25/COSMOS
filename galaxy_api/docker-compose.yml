services:
  postgres:
    image: postgres:17-alpine
    container_name: galaxy-postgres
    environment:
      POSTGRES_DB: galaxy
      POSTGRES_USER: galaxy
      POSTGRES_PASSWORD: galaxy1234
    ports:
      - "5432:5432"
    volumes:
      - galaxy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galaxy -d galaxy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  galaxy-pgdata:
