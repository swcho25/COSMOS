spring:
  application:
    name: galaxy-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/galaxy}
    username: ${DB_USERNAME:galaxy}
    password: ${DB_PASSWORD:galaxy1234}

  # schema.sql을 매 기동마다 실행 (스크립트가 IF NOT EXISTS로 멱등해야 함)
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 schema.sql이 전담, JPA는 엔티티-테이블 일치 검증만
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
