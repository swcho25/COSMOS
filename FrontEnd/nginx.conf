server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 번들은 압축 없이 나가면 three 청크 하나만 1.1MB 다 (2026-09-18 Lighthouse: 전송량 = 원본 크기).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The host Nginx routes API requests directly to Spring Boot.
    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Vite content hashes make these files safe to cache across deployments.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
