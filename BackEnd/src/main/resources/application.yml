spring:
  application:
    name: cosmos-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cosmos}
    username: ${DB_USERNAME:cosmos}
    password: ${DB_PASSWORD:cosmos1234}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 schema.sql이 전담, JPA는 엔티티-테이블 일치 검증만
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
