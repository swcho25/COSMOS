spring:
  application:
    name: cosmos-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cosmos}
    username: ${DB_USERNAME:cosmos}
    password: ${DB_PASSWORD:cosmos1234}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리하고 JPA는 Entity와의 일치 여부만 검증
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
